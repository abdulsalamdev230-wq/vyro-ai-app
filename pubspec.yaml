name: vyro_ai
description: "VYRO AI — Premium AI Video & Reels Maker. A complete working Android application with Firebase, Node.js backend, FFmpeg video processing, AI image/video generation, TTS, AdMob and in-app purchases."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- State management ---
  provider: ^6.1.2

  # --- Firebase ---
  firebase_core: ^3.5.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.3.0
  firebase_storage: ^12.2.0

  # --- HTTP / Networking ---
  dio: ^5.7.0
  http: ^1.3.0

  # --- Environment / Config ---
  flutter_dotenv: ^5.2.1

  # --- Local storage / prefs ---
  shared_preferences: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0

  # --- Media / Video ---
  video_player: ^2.9.2
  chewie: ^1.8.2
  share_plus: ^10.1.2
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # --- FFmpeg video processing (Arthenica ffmpeg-kit retired 2025; community fork) ---
  ffmpeg_kit_flutter_new_min: ^3.6.8

  # --- Permissions & connectivity ---
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.1

  # --- Animations ---
  animate_do: ^3.3.4
  flutter_animate: ^4.5.2
  lottie: ^3.1.2

  # --- UI / Design ---
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  intl: ^0.19.0
  flutter_markdown_plus: ^1.0.3

  # --- Monetization ---
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.1.11

  # --- Social Authentication ---
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1
  sign_in_with_apple: ^6.1.1

  # --- Utilities ---
  collection: ^1.19.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App icon generation — Vyro AI Neon Orbital Icon
flutter_launcher_icons:
  image_path: "assets/icon/vyro_icon.png"
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B14"
  adaptive_icon_foreground: "assets/icon/vyro_icon_fg.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/
    - assets/images/
    - assets/images/onboarding/
    - assets/images/templates/
    - assets/animations/
    - assets/animations/lottie/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Orbitron_700Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
